services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repositorio
      POSTGRES_PASSWORD: repositorio
      POSTGRES_DB: repositorio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repositorio"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://repositorio:repositorio@db:5432/repositorio?schema=public
      NEXTAUTH_SECRET: docker-local-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://repositorio:repositorio@db:5432/repositorio?schema=public
      NEXTAUTH_SECRET: docker-local-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
